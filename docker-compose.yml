services:
  nginx:
    build:
      context: ./build/nginx
    image: nginx-mage:v1.0
    hostname: nginx
    volumes:
      - ./conf/nginx/enabled.d:/etc/nginx/conf.d
      - ./conf/nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
      - ./sources:/home/public_html
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
      - 443:443
    dns:
      - 8.8.8.8
      - 1.1.1.1
  nginx130:
    image: nginx:1.30.0
    hostname: nginx130
    volumes:
      - ./conf/nginx/enabled.d:/etc/nginx/conf.d
      - ./conf/nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
      - ./sources:/home/public_html
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 80:80
      - 443:443
    depends_on:
      - php85
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    dns:
      - 8.8.8.8
      - 1.1.1.1
  php70:
    build:
      context: ./build/php70
    image: php7.0-mage:v1.0
    hostname: php70
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php70/magento.conf:/etc/php/7.0/fpm/pool.d/www.conf
      - ./conf/php/php70/php.ini:/etc/php/7.0/fpm/php.ini
      - ./conf/php/php70/php.ini:/etc/php/7.0/cli/php.ini


  php71:
    build:
      context: ./build/php71
    image: php7.1-mage:v1.0
    hostname: php71
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php71/magento.conf:/etc/php/7.1/fpm/pool.d/www.conf
      - ./conf/php/php71/php.ini:/etc/php/7.1/fpm/php.ini
      - ./conf/php/php71/php.ini:/etc/php/7.1/cli/php.ini


  php72:
    build:
      context: ./build/php72
    image: php7.2-mage:v1.0
    hostname: php72
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php72/magento.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./conf/php/php72/php.ini:/usr/local/etc/php/php.ini

  php73:
    build:
      context: ./build/php73
    image: php7.3-mage:v1.0
    hostname: php73
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php73/magento.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./conf/php/php73/php.ini:/usr/local/etc/php/php.ini

  php74:
    build:
      context: ./build/php74
    image: php7.4-mage:v1.0
    hostname: php74
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php74/magento.conf:/etc/php/7.4/fpm/pool.d/www.conf
      - ./conf/php/php74/php.ini:/etc/php/7.4/fpm/php.ini
      - ./conf/php/php74/php.ini:/etc/php/7.4/cli/php.ini

  php74-c2:
    build:
      context: ./build/php74-c2
    image: php7.4-c2-mage:v1.0
    hostname: php74-c2
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php74-c2/magento.conf:/etc/php/7.4/fpm/pool.d/www.conf
      - ./conf/php/php74-c2/php.ini:/etc/php/7.4/fpm/php.ini
      - ./conf/php/php74-c2/php.ini:/etc/php/7.4/cli/php.ini

  php81-c2:
    build:
      context: ./build/php81-c2
    image: php8.1-c2-mage:v1.0
    hostname: php81-c2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - COMPOSER_PROCESS_TIMEOUT=2000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php81-c2/magento.conf:/etc/php/8.1/fpm/pool.d/www.conf
      - ./conf/php/php81-c2/php.ini:/etc/php/8.1/fpm/php.ini
      - ./conf/php/php81-c2/php.ini:/etc/php/8.1/cli/php.ini
  php82:
    build:
      context: ./build/php82
    image: php8.2-mage:v1.0
    hostname: php82
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php82/magento.conf:/etc/php/8.2/fpm/pool.d/www.conf
      - ./conf/php/php82/php.ini:/etc/php/8.2/fpm/php.ini
      - ./conf/php/php82/php.ini:/etc/php/8.2/cli/php.ini
    dns:
      - 8.8.8.8
      - 1.1.1.1
  php83:
    build:
      context: ./build/php83
    image: php8.3-mage:v1.0
    hostname: php83
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "local.mycar-api.com:host-gateway"
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php83/magento.conf:/etc/php/8.3/fpm/pool.d/www.conf
      - ./conf/php/php83/php.ini:/etc/php/8.3/fpm/php.ini
      - ./conf/php/php83/php.ini:/etc/php/8.3/cli/php.ini
  php84:
    build:
      context: ./build/php84
    image: php8.4-mage:v1.0
    hostname: php84
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php84/magento.conf:/etc/php/8.4/fpm/pool.d/www.conf
      - ./conf/php/php84/php.ini:/etc/php/8.4/fpm/php.ini
      - ./conf/php/php84/php.ini:/etc/php/8.4/cli/php.ini
  php85:
    build:
      context: ./build/php85
    image: php8.5-mage:v1.0
    hostname: php85
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - COMPOSER_AUTH=${COMPOSER_AUTH:-}
      - COMPOSER_PROCESS_TIMEOUT=${COMPOSER_PROCESS_TIMEOUT:-2000}
      - ENABLE_XDEBUG=${ENABLE_XDEBUG:-0}
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php85/magento.conf:/etc/php/8.5/fpm/pool.d/www.conf
      - ./conf/php/php85/php.ini:/etc/php/8.5/fpm/php.ini
      - ./conf/php/php85/php.ini:/etc/php/8.5/cli/php.ini
    healthcheck:
      test: ["CMD-SHELL", "php-fpm8.5 -t >/dev/null 2>&1 && php -v >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    dns:
      - 8.8.8.8
      - 1.1.1.1
  mysql:
    hostname: mysql
    image: mysql:${MYSQL_VERSION}
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./conf/mysql/conf.d:/etc/mysql/conf.d
    ports:
      - 3308:3306

  mysql57:
    hostname: mysql57
    image: mysql:5.7
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql57:/var/lib/mysql
      - ./conf/mysql/conf.d:/etc/mysql/conf.d
    ports:
      - 3309:3306

  mysql84:
    hostname: mysql84
    image: mysql:8.4.6
    command:
      - --mysql-native-password=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=1024M
    environment:
      - MYSQL_DATABASE=${ROWE249_MYSQL_DATABASE:-}
      - MYSQL_USER=${ROWE249_MYSQL_USER:-}
      - MYSQL_PASSWORD=${ROWE249_MYSQL_PASSWORD:-}
      - MYSQL_ROOT_PASSWORD=${ROWE249_MYSQL_ROOT_PASSWORD:-}
    volumes:
      - mysql84_data:/var/lib/mysql
      - ./conf/mysql84/conf.d:/etc/mysql/conf.d:ro
    ports:
      - "127.0.0.1:3310:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 30s
      timeout: 10s
      retries: 10

  mailhog:
    image: axllent/mailpit
    ports:
      - 1025:1025
      - 8025:8025

  redis:
#      image: "redis:6.0-alpine"
      image: "redis:7.2"
      ports:
        - "127.0.0.1:6379:6379"
      sysctls:
        - "net.core.somaxconn=65535"
      volumes:
        - "redis_data:/data"

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - compatibility.override_main_response_version=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1536m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    privileged: true
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  # opensearchv3:
  #   image: opensearchproject/opensearch:3
  #   # container_name: opensearch3
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   volumes:
  #         - opensearch-data:/usr/share/opensearch/data
  #   environment:
  #     "discovery.type": "single-node"
  #     OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Opensearch@86421"
  #     DISABLE_SECURITY_PLUGIN: true
  elasticsearch8:
    build:
      context: ./build/elasticsearch8
      args: 
          ELASTICSEARCH_VERSION: ${ELASTICSEARCH_VERSION_8}
    image: elasticsearch-manual:${ELASTICSEARCH_VERSION_8}
    environment:
      - discovery.type=single-node
      - node.name=elasticseach
      - cluster.name=es-docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 1536m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    privileged: true
    volumes:
      - elasticsearch-data8:/usr/share/elasticsearch8/data
    ports:
      - "9200:9200"
    networks:
      default:
        aliases:
          - elasticsearch

  opensearch3:
    image: opensearchproject/opensearch:3.2.0
    hostname: opensearch3
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${ROWE249_OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
      - DISABLE_SECURITY_PLUGIN=${ROWE249_OPENSEARCH_DISABLE_SECURITY:-true}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 1536m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch3_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9201:9200"
      - "127.0.0.1:9301:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  elasticsearch:
      build:
        context: ./build/elasticsearch
        args: 
          ELASTICSEARCH_VERSION: ${ELASTICSEARCH_VERSION}
      image: elasticsearch-manual:${ELASTICSEARCH_VERSION}
      environment:
          - discovery.type=single-node
          - node.name=elasticseach
          - cluster.name=es-docker-cluster
          - bootstrap.memory_lock=true
          - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      mem_limit: 1536m
      ulimits:
          memlock:
              soft: -1
              hard: -1
      volumes:
          - elasticsearch-data:/usr/share/elasticsearch/data
      ports:
          - 9200:9200

  kibana:
      image: kibana:${ELASTICSEARCH_VERSION}
      environment:
          SERVER_NAME: kibana
          ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      depends_on:
          - elasticsearch
      ports:
          - 5601:5601

  rabbitmq:
      image: rabbitmq:3-management-alpine
      volumes:
          - rabbitmq-data:/var/lib/rabbitmq/
      environment:
          RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
          RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
          RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      ports:
          - 5672:5672
          - 15672:15672
  rabbitmq43:
      image: rabbitmq:4.3.1-management
      hostname: rabbitmq43
      volumes:
          - rabbitmq43_data:/var/lib/rabbitmq/
      environment:
          RABBITMQ_DEFAULT_USER: ${ROWE249_RABBITMQ_USER:-}
          RABBITMQ_DEFAULT_PASS: ${ROWE249_RABBITMQ_PASSWORD:-}
      ports:
          - "127.0.0.1:5673:5672"
          - "127.0.0.1:15673:15672"
      healthcheck:
          test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
          interval: 30s
          timeout: 10s
          retries: 5
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1

  phpredmin:
      image: sasanrose/phpredmin
      environment:
          - PHPREDMIN_DATABASE_REDIS_0_HOST=redis
      ports:
          - "8081:80"
      depends_on:
          - redis

  varnish:
    build:
      context: ./build/varnish
    image: varnish-6.0:v1
    hostname: varnish
    ports:
      - 6081:6081
    depends_on:
      - nginx
    volumes:
      - ./conf/varnish/default.vcl:/etc/varnish/default.vcl

  varnish8:
    image: varnish:8.0.0
    hostname: varnish8
    ports:
      - "127.0.0.1:6082:6081"
    depends_on:
      - nginx130
    volumes:
      - ./conf/varnish/rowe249.vcl:/etc/varnish/default.vcl:ro
    command: ["varnishd", "-F", "-f", "/etc/varnish/default.vcl", "-a", ":6081", "-s", "malloc,256m"]

  rowe249-cron:
    image: php8.5-mage:v1.0
    hostname: rowe249-cron
    depends_on:
      - php85
      - mysql84
      - redis
      - opensearch3
    working_dir: /home/public_html/local.rowe.com
    environment:
      - COMPOSER_AUTH=${COMPOSER_AUTH:-}
      - ENABLE_XDEBUG=0
      - ROWE249_CRON_INTERVAL=${ROWE249_CRON_INTERVAL:-60}
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php85/php.ini:/etc/php/8.5/cli/php.ini
    command: ["bash", "-lc", "trap 'exit 0' TERM INT; while :; do php bin/magento cron:run || true; sleep \"$${ROWE249_CRON_INTERVAL}\" & wait $$!; done"]

  rowe249-consumer:
    image: php8.5-mage:v1.0
    hostname: rowe249-consumer
    depends_on:
      - php85
      - mysql84
      - redis
      - opensearch3
      - rabbitmq43
    working_dir: /home/public_html/local.rowe.com
    environment:
      - COMPOSER_AUTH=${COMPOSER_AUTH:-}
      - ENABLE_XDEBUG=0
      - ROWE249_CONSUMERS_ENABLED=${ROWE249_CONSUMERS_ENABLED:-0}
      - ROWE249_CONSUMERS=${ROWE249_CONSUMERS:-async.operations.all}
    volumes:
      - ./sources:/home/public_html
      - composer_cache:/home/nginx/.composer
      - ./conf/php/php85/php.ini:/etc/php/8.5/cli/php.ini
    command: ["bash", "-lc", "if [ \"$${ROWE249_CONSUMERS_ENABLED}\" != \"1\" ]; then echo 'rowe249 consumers disabled'; sleep infinity; fi; for consumer in $${ROWE249_CONSUMERS}; do php bin/magento queue:consumers:start \"$${consumer}\" --max-messages=10000 & done; wait"]

volumes: 
  composer_cache:
  composer_cache_file:
  mysql84_data:
  elasticsearch-data:
  elasticsearch-data8:
  opensearch-data:
  opensearch3_data:
  redis_data:
  rabbitmq-data:
  rabbitmq43_data:
